name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-release:
    name: Check for new version
    # This fork publishes its own packages under the @scriptc-fork scope;
    # the guard keeps any further fork of THIS repo from trying to publish
    # them (the trusted publisher is pinned to this repository).
    if: github.repository == 'vinikjkkj/scriptc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Compare package.json version to npm
        id: check
        run: |
          # Read BOTH the name and the version from the CLI manifest. The
          # name used to be hardcoded as "scriptc"; after the fork renamed
          # the packages that check silently compared against the upstream
          # package and would have published on every push.
          NAME=$(node -p "require('./packages/cli/package.json').name")
          LOCAL_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "Package: $NAME"
          echo "Local version: $LOCAL_VERSION"

          # A package that has never been published makes `npm view` fail;
          # 0.0.0 then differs from any real version and the release runs.
          NPM_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0")
          echo "npm version: $NPM_VERSION"

          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "Version changed: $NPM_VERSION -> $LOCAL_VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged on npm, skipping publish"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Publishing uses npm trusted publishing (OIDC): the job's id-token
      # permission lets npm mint short-lived credentials, so no npm token
      # secret exists anywhere in this repo. All three packages —
      # @scriptc-fork/runtime, @scriptc-fork/compiler, @scriptc-fork/scriptc
      # — must each be configured on npmjs.com with a GitHub Actions
      # trusted publisher pointing at repository vinikjkkj/scriptc,
      # workflow release.yml, environment Release. A package missing that
      # configuration fails with an OIDC authentication error before
      # anything uploads. See RELEASING.md for the one-time setup, which
      # a maintainer must do by hand on npmjs.com; it cannot be scripted
      # from here. Trusted publishing requires npm >= 11.5.1 (bundled with
      # Node 24).
      #
      # The upstream packages (@scriptc/runtime, @scriptc/compiler,
      # scriptc) belong to vercel-labs and are configured with a trusted
      # publisher pointing at THEIR repository. This workflow can never
      # publish to them, by construction.

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: Check version sync
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          for pkg in packages/runtime packages/compiler packages/cli; do
            V=$(node -p "require('./$pkg/package.json').version")
            if [ "$V" != "$VERSION" ]; then
              echo "Version mismatch: $pkg is $V, expected $VERSION"
              echo "Run 'node scripts/sync-versions.mjs' to stamp runtime and compiler from the CLI version, then commit"
              exit 1
            fi
          done

      - name: Publish to npm
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"

          # npm accepts --provenance only from PUBLIC source repositories;
          # while this repo is internal the flag is dropped, and the same
          # step starts attaching provenance the moment the repo goes
          # public — no workflow edit.
          VISIBILITY=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          if [ "$VISIBILITY" = "public" ]; then
            PROVENANCE="--provenance"
          else
            PROVENANCE=""
            echo "repository visibility is '$VISIBILITY': publishing without provenance"
          fi

          # Dependency order, so each package's deps are resolvable the
          # moment it lands. npm publish on the tarball handles OIDC.
          # Re-runs skip anything already on the registry at this version.
          #
          # The workspace deps are written in the ALIAS form
          # "@scriptc/runtime": "workspace:@scriptc-fork/runtime@*", which
          # pnpm pack rewrites to "npm:@scriptc-fork/runtime@<version>".
          # That is what keeps the fork's packages installable under the
          # ORIGINAL @scriptc/* directory names, so the ~100 source files
          # that import "@scriptc/compiler" by specifier — and the
          # compiler's own self-referencing require.resolve calls in
          # packages/compiler/src/frontend/shared.ts — resolve unchanged.
          # If a packed manifest ever shows a bare "workspace:" spec, the
          # rewrite did not happen and the tarball must NOT be published.
          publish_dir() {
            dir="$1"
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published, skipping"
              return 0
            fi
            tarball=$(cd "$dir" && pnpm pack --silent | tail -1)
            if tar -xzOf "$dir/$tarball" package/package.json | grep -q '"workspace:'; then
              echo "$name@$VERSION still carries a workspace: dependency spec after pnpm pack"
              echo "Publishing it would produce an uninstallable package; aborting."
              exit 1
            fi
            npm publish "$dir/$tarball" $PROVENANCE --access public
          }

          publish_dir packages/runtime
          publish_dir packages/compiler
          publish_dir packages/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The GitHub release is a tag, notes, and one asset: the surface
  # manifest (packages/compiler/surface-manifest.json — the machine-
  # readable listing of the surface the static tier compiles at this
  # version, regenerated here and verified against the committed file).
  # scriptc has no platform binary assets to stage (programs compile on
  # the user's machine), so the job runs AFTER a successful npm publish
  # and never gates it. The body is the CHANGELOG.md block between the
  # release:start/release:end markers, which RELEASING.md keeps on the
  # latest entry only.
  github-release:
    name: Create GitHub Release
    needs: [check-release, publish]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Regenerate the surface manifest from this tree and require it to
      # match the committed file byte-for-byte — the same staleness guard
      # the test suite runs — so the attached asset is provably the
      # manifest of the code being released.
      - name: Generate surface manifest
        run: |
          pnpm install --frozen-lockfile
          pnpm manifest --check

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{exit} found{print}' CHANGELOG.md > /tmp/release-notes.md

          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes for $VERSION ($LINES lines)"

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="v$VERSION"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, skipping creation"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi

          # Attach the surface manifest (idempotent: --clobber makes
          # re-runs replace the asset instead of failing).
          gh release upload "$TAG" packages/compiler/surface-manifest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
