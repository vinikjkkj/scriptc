name: bench
run-name: bench ${{ inputs.target }}${{ inputs.base != '' && format(' vs {0}', inputs.base) || '' }} [${{ inputs.programs }}] ${{ inputs.variants }} ${{ inputs.tag }}

# App builds and RAM measurements on GitHub runners instead of the box. The compiler under test is checked out from `target`; the harness (tests/bench), the census headers
# (tests/perf/dyncensus) and the clientbench transport come from the dispatched ref. One job per program: build once per (sha, program, codegen flags) and reuse the cached
# lowering for flag-only variants (SCRIPTC_PROF_CFLAGS is not part of the lowering key), then run the binaries beside Node against service containers and upload the numbers.
# CPU seconds on shared runners are noise: the only CPU figure produced here is callgrind Ir.
on:
  # TEMPORARY, bench1 only: a workflow file can be dispatched only once it is on the default branch, so on this branch a push reads its inputs from tests/bench/dispatch.json.
  # Remove this trigger (and dispatch.json) when the workflow lands on main.
  push:
    branches: [bench1]
    paths: [tests/bench/dispatch.json]
  workflow_dispatch:
    inputs:
      target:
        description: Branch or FULL 40-character commit whose compiler is measured (the CANDIDATE arm)
        required: true
      base:
        description: "Optional second compiler (branch or FULL sha), the BASE arm: both compilers are built and measured on the SAME runner in the same run, arms interleaved, and the summary tabulates the difference"
        required: false
        default: ""
      programs:
        description: "Space or comma separated: messaging-redis messaging-mysql messaging-postgres messaging-sqlite messaging-memory (rest: not implemented yet)"
        required: false
        default: messaging-redis
      variants:
        description: "Space or comma separated: plain (the shipped build) and/or census (dyn + string census headers, same lowering, clang only). layout-profile / layout-order: not implemented yet"
        required: false
        default: plain
      reps:
        description: Interleaved pmon runs per arm (rss_peak_kb median over these)
        required: false
        default: "3"
      backend:
        description: c or llvm
        required: false
        default: c
      node_ref:
        description: "true: also run the same bench entry on Node (tsx) as the output-parity reference and the Node RSS baseline"
        required: false
        default: "true"
      ir:
        description: "Messages per scenario for one callgrind run per variant (0 = no callgrind). The only CPU figure; 250 takes about an hour"
        required: false
        default: "0"
      node_heap_mb:
        description: Node heap (MB) of the compiler process
        required: false
        default: "12288"
      tag:
        description: Free text echoed in the run name
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Select programs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      target: ${{ steps.m.outputs.target }}
      base: ${{ steps.m.outputs.base }}
      programs: ${{ steps.m.outputs.programs }}
      variants: ${{ steps.m.outputs.variants }}
      reps: ${{ steps.m.outputs.reps }}
      backend: ${{ steps.m.outputs.backend }}
      node_ref: ${{ steps.m.outputs.node_ref }}
      ir: ${{ steps.m.outputs.ir }}
      node_heap_mb: ${{ steps.m.outputs.node_heap_mb }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/bench/dispatch.json
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          I_TARGET: ${{ inputs.target }}
          I_BASE: ${{ inputs.base }}
          I_PROGRAMS: ${{ inputs.programs }}
          I_VARIANTS: ${{ inputs.variants }}
          I_REPS: ${{ inputs.reps }}
          I_BACKEND: ${{ inputs.backend }}
          I_NODE_REF: ${{ inputs.node_ref }}
          I_IR: ${{ inputs.ir }}
          I_HEAP: ${{ inputs.node_heap_mb }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            j=tests/bench/dispatch.json
            TARGET=$(jq -r .target $j); BASE=$(jq -r '.base // ""' $j); PROGRAMS=$(jq -r '.programs // "messaging-redis"' $j); VARIANTS=$(jq -r '.variants // "plain"' $j)
            REPS=$(jq -r '.reps // "3"' $j); BACKEND=$(jq -r '.backend // "c"' $j); NODE_REF=$(jq -r '.node_ref // "true"' $j)
            IR=$(jq -r '.ir // "0"' $j); HEAP=$(jq -r '.node_heap_mb // "12288"' $j)
          else
            TARGET=$I_TARGET; BASE=$I_BASE; PROGRAMS=$I_PROGRAMS; VARIANTS=$I_VARIANTS; REPS=$I_REPS; BACKEND=$I_BACKEND; NODE_REF=$I_NODE_REF; IR=$I_IR; HEAP=$I_HEAP
          fi
          out=()
          for p in ${PROGRAMS//,/ }; do
            case "$p" in
              messaging-redis|messaging-mysql|messaging-postgres|messaging-sqlite|messaging-memory) out+=("\"$p\"") ;;
              rest) echo "rest is not implemented in bench.yml yet"; exit 1 ;;
              *) echo "unknown program: $p"; exit 1 ;;
            esac
          done
          [ ${#out[@]} -gt 0 ] || { echo "no program selected"; exit 1; }
          for v in ${VARIANTS//,/ }; do
            case "$v" in plain|census) ;; *) echo "unknown variant: $v"; exit 1 ;; esac
          done
          case "$BACKEND" in c|llvm) ;; *) echo "unknown backend: $BACKEND"; exit 1 ;; esac
          {
            echo "matrix=[$(IFS=,; echo "${out[*]}")]"
            echo "target=$TARGET"; echo "base=$BASE"; echo "programs=$PROGRAMS"; echo "variants=$VARIANTS"; echo "reps=$REPS"; echo "backend=$BACKEND"
            echo "node_ref=$NODE_REF"; echo "ir=$IR"; echo "node_heap_mb=$HEAP"
          } >> "$GITHUB_OUTPUT"

  bench:
    name: ${{ matrix.program }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        program: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: zapo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BENCH_WORK: ${{ github.workspace }}/bench-work
      SCRIPTC_CACHE_DIR: ${{ github.workspace }}/scc-cache
      NODE_HEAP_MB: ${{ needs.plan.outputs.node_heap_mb }}
    steps:
      - name: Record the runner hardware
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz' || true
          free -m | sed -n 1,2p
          df -h / | tail -1
          uname -r; ldd --version | head -1
      - uses: actions/checkout@v4
        with:
          path: benchsrc
          sparse-checkout: |
            tests/bench
            tests/perf/clientbench/transport
            tests/perf/dyncensus
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.target }}
          path: wt
      - uses: actions/checkout@v4
        if: ${{ needs.plan.outputs.base != '' }}
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: wt-base
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: wt/.node-version
      - name: Build the compiler(s) under test
        run: |
          set -eu
          for d in wt wt-base; do
            [ -d "$d" ] || continue
            ( cd "$d" && pnpm install --frozen-lockfile && pnpm build && git rev-parse HEAD > "$GITHUB_WORKSPACE/$d.sha" )
          done
          echo "candidate: $(cat wt.sha)"; [ -f wt-base.sha ] && echo "base: $(cat wt-base.sha)" || true
      - name: Tools (valgrind for the Ir run)
        if: ${{ needs.plan.outputs.ir != '0' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      # The provenance cache holds the zapo source the compiler maps (fetched by commit from github).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/scriptc/provenance
          key: provenance-bench-${{ hashFiles('benchsrc/tests/bench/app/package-lock.json') }}
      - name: Fetch the zapo tree and the app dependencies
        working-directory: benchsrc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/bench/harness/fetch-tree.sh
      - name: Make the bench program
        working-directory: benchsrc
        run: |
          store=${{ matrix.program }}; store=${store#messaging-}
          bash tests/bench/harness/mkbench.sh "$store" messaging
      - name: Build every arm and variant (one lowering per compiler; flag-only variants re-run only clang)
        working-directory: benchsrc
        run: |
          set -u
          store=${{ matrix.program }}; store=${store#messaging-}
          variants="${{ needs.plan.outputs.variants }}"; variants=${variants//,/ }
          for side in cand base; do
            if [ $side = cand ]; then cli="$GITHUB_WORKSPACE/wt/packages/cli/dist/main.js"; else cli="$GITHUB_WORKSPACE/wt-base/packages/cli/dist/main.js"; [ -d "$GITHUB_WORKSPACE/wt-base" ] || continue; fi
            for one in $variants; do
              SCC_CLI="$cli" bash tests/bench/harness/build.sh "$store" "${{ needs.plan.outputs.backend }}" "$BENCH_WORK/out/$side" "$one" || echo "build of $side/$one failed"
            done
          done
          cat "$BENCH_WORK"/out/*/build-summary.txt
      - name: Run the binaries beside Node, measure
        working-directory: benchsrc
        run: |
          set -u
          store=${{ matrix.program }}; store=${store#messaging-}
          . tests/bench/harness/env.sh
          arms=()
          variants="${{ needs.plan.outputs.variants }}"; variants=${variants//,/ }
          # base first, then cand, so a table row reads base then candidate; the harness rotates the order per rep
          for side in base cand; do
            [ -d "$BENCH_WORK/out/$side" ] || continue
            for one in $variants; do
              suffix=""; [ "$one" = census ] && suffix="-census"
              f="$BENCH_WORK/out/$side/messaging-$store-${{ needs.plan.outputs.backend }}$suffix.bin"
              [ -f "$f" ] && { chmod +x "$f"; arms+=("$side$suffix:$f"); }
            done
          done
          [ ${#arms[@]} -gt 0 ] || { echo "no binary was built"; exit 1; }
          flags=(--store "$store" --out "$BENCH_WORK/result" --reps "${{ needs.plan.outputs.reps }}" --smaps)
          [ "${{ needs.plan.outputs.node_ref }}" = true ] && flags+=(--node)
          [ "${{ needs.plan.outputs.ir }}" != 0 ] && flags+=(--ir "${{ needs.plan.outputs.ir }}")
          node tests/bench/harness/run.mjs "${flags[@]}" "${arms[@]}" | tee "$BENCH_WORK/result-summary.txt"
          { echo "### ${{ matrix.program }} (${{ needs.plan.outputs.backend }})"; echo "candidate \`$(cat $GITHUB_WORKSPACE/wt.sha)\`$( [ -f $GITHUB_WORKSPACE/wt-base.sha ] && echo " base \`$(cat $GITHUB_WORKSPACE/wt-base.sha)\`")"; echo; cat "$BENCH_WORK/result/summary.md"; echo; echo '```'; cat "$BENCH_WORK"/out/*/build-summary.txt; cat "$BENCH_WORK/result-summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.program }}
          path: |
            bench-work/out/*/*.log
            bench-work/out/*/build-summary.txt
            bench-work/result/
            bench-work/result-summary.txt
          if-no-files-found: ignore
          retention-days: 14
      # the binaries, so a later turn can reuse them by path and sha instead of rebuilding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.program }}-bin
          path: bench-work/out/*/*.bin
          if-no-files-found: ignore
          retention-days: 14
