name: drivers
run-name: drivers ${{ inputs.target }} [${{ inputs.drivers }}] ${{ inputs.tag }}

# Real driver builds (the zapo store entries of mysql2, pg, ioredis, mongodb)
# for any branch or commit, one runner per driver. The rig inputs and this
# workflow come from the dispatched ref (main); the compiler under test is
# checked out from `target`, so a candidate branch needs neither file.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Branch or commit whose compiler is measured
        required: true
      drivers:
        description: Drivers to build (space or comma separated subset of mysql2 pg ioredis mongodb, plus the connect and roundtrip entries mysql2-connect pg-connect mysql2-roundtrip pg-roundtrip mysql2-pool, each also with a -llvm suffix; mysql2-execunion needs no server for the LLVM backend)
        required: false
        default: mysql2 pg ioredis mongodb
      run:
        description: "true: run the built binary of every selected -connect / -roundtrip entry beside Node (MySQL 8 and Postgres 16 service containers) and diff stdout, stderr and the exit code"
        required: false
        default: "false"
      tag:
        description: Free text echoed in the run name, to find the run
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Select drivers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      runmatrix: ${{ steps.m.outputs.runmatrix }}
    steps:
      - id: m
        env:
          DRIVERS: ${{ inputs.drivers }}
          RUN: ${{ inputs.run }}
        run: |
          set -euo pipefail
          out=()
          runs=()
          for d in ${DRIVERS//,/ }; do
            case "$d" in
              mysql2|pg|ioredis|mongodb) out+=("\"$d\"") ;;
              mysql2-connect|pg-connect|mysql2-roundtrip|pg-roundtrip|mysql2-pool|mysql2-execunion|mysql2-execunion-llvm|mysql2-connect-llvm|pg-connect-llvm|mysql2-roundtrip-llvm|pg-roundtrip-llvm|mysql2-pool-llvm) out+=("\"$d\""); runs+=("\"$d\"") ;;
              *) echo "unknown driver: $d"; exit 1 ;;
            esac
          done
          [ ${#out[@]} -gt 0 ] || { echo "no driver selected"; exit 1; }
          echo "matrix=[$(IFS=,; echo "${out[*]}")]" >> "$GITHUB_OUTPUT"
          if [ "$RUN" = true ]; then
            echo "runmatrix=[$(IFS=,; echo "${runs[*]:-}")]" >> "$GITHUB_OUTPUT"
          else
            echo "runmatrix=[]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: driver ${{ matrix.driver }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Record the runner hardware
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz' || true
          free -m | sed -n 1,2p
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          path: rigsrc
          sparse-checkout: tests/driver-rigs
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          path: wt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: wt/.node-version
      - name: Build the compiler under test
        working-directory: wt
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install the rig
        working-directory: rigsrc/tests/driver-rigs
        # The box installs the rig without running dependency build scripts
        # (zapo-js's prepare/preinstall); mirror that so pnpm's strict
        # ignored-builds check does not fail the install.
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --config.strict-dep-builds=false
      # The provenance cache holds the checked-out package sources the
      # compiler maps (a mongodb checkout is ~2 GB); keyed by the rig lockfile.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/scriptc/provenance
          key: provenance-${{ matrix.driver }}-${{ hashFiles('rigsrc/tests/driver-rigs/pnpm-lock.yaml') }}
      - name: Build the driver
        run: bash rigsrc/tests/driver-rigs/build.sh "${{ matrix.driver }}" "$GITHUB_WORKSPACE/wt/packages/cli/dist/main.js" "$GITHUB_WORKSPACE/out/${{ matrix.driver }}"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.driver }}
          path: out/${{ matrix.driver }}.txt
          retention-days: 14
      # The binary of a successful build, to run it (absent when the build is refused).
      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.driver }}-bin
          path: out/${{ matrix.driver }}.bin
          if-no-files-found: ignore
          retention-days: 14

  # The built binary of a connect or roundtrip entry, run beside Node on the same entry. MySQL 8 and Postgres 16 are service
  # containers of this job (127.0.0.1:3306 / :5432, password p); the connect entries need no server (a closed port).
  run:
    name: run ${{ matrix.driver }}
    needs: [plan, build]
    if: ${{ always() && needs.plan.outputs.runmatrix != '[]' && needs.plan.outputs.runmatrix != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.plan.outputs.runmatrix) }}
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: p
          MYSQL_DATABASE: d
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: p
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: rigsrc
          sparse-checkout: tests/driver-rigs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install the rig
        working-directory: rigsrc/tests/driver-rigs
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --config.strict-dep-builds=false
      - uses: actions/download-artifact@v4
        id: bin
        continue-on-error: true
        with:
          name: driver-${{ matrix.driver }}-bin
          path: out
      - name: Run the binary and Node, diff stdout, stderr and the exit code
        run: |
          set -u
          if [ ! -f "out/${{ matrix.driver }}.bin" ]; then
            echo "no binary: the build of ${{ matrix.driver }} was refused (see the build job)"
            exit 1
          fi
          chmod +x "out/${{ matrix.driver }}.bin"
          bash rigsrc/tests/driver-rigs/run-compare.sh "${{ matrix.driver }}" "out/${{ matrix.driver }}.bin" "$GITHUB_WORKSPACE/runout"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ matrix.driver }}
          path: runout
          if-no-files-found: ignore
          retention-days: 14
