name: drivers
run-name: drivers ${{ inputs.target }} [${{ inputs.drivers }}] ${{ inputs.tag }}

# Real driver builds (the zapo store entries of mysql2, pg, ioredis, mongodb)
# for any branch or commit, one runner per driver. The rig inputs and this
# workflow come from the dispatched ref (main); the compiler under test is
# checked out from `target`, so a candidate branch needs neither file.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Branch or commit whose compiler is measured
        required: true
      drivers:
        description: Drivers to build (space or comma separated subset of mysql2 pg ioredis mongodb, plus the connect and roundtrip entries mysql2-connect pg-connect mysql2-roundtrip pg-roundtrip, plus the zapo-js core entries zapo-core zapo-core-llvm, plus the zapo-js startup run entries zapo-startup zapo-startup-llvm)
        required: false
        default: mysql2 pg ioredis mongodb
      run:
        description: "true: run the built binary of every selected -connect / -roundtrip entry beside Node (MySQL 8 and Postgres 16 service containers) and diff stdout, stderr and the exit code"
        required: false
        default: "false"
      tag:
        description: Free text echoed in the run name, to find the run
        required: false
        default: ""
      os:
        description: "linux (default), windows (the zapo-core / zapo-startup entries on windows-latest with zig cc, the target of the Windows CI lane) or both"
        required: false
        default: linux
      gnu_tar:
        description: "true (default): the windows lane puts Git for Windows' GNU tar first on PATH; false: the runner's default PowerShell PATH, where tar is the Windows bsdtar"
        required: false
        default: "true"
      fresh_cache:
        description: "true: the windows lane starts with an empty provenance cache (a cached source tree skips the tarball extraction, so it hides an extraction defect)"
        required: false
        default: "false"
      node_heap_mb:
        description: "Override of the node heap (MB) the driver build runs with (default 12288); a tiny value is the positive control that a build which dies fails the zapo gate"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Select drivers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      runmatrix: ${{ steps.m.outputs.runmatrix }}
      winmatrix: ${{ steps.m.outputs.winmatrix }}
    steps:
      - id: m
        env:
          DRIVERS: ${{ inputs.drivers }}
          RUN: ${{ inputs.run }}
          OS: ${{ inputs.os }}
        run: |
          set -euo pipefail
          out=()
          runs=()
          for d in ${DRIVERS//,/ }; do
            case "$d" in
              mysql2|pg|ioredis|mongodb|zapo-core|zapo-core-llvm) out+=("\"$d\"") ;;
              mysql2-connect|pg-connect|mysql2-roundtrip|pg-roundtrip|zapo-startup|zapo-startup-llvm) out+=("\"$d\""); runs+=("\"$d\"") ;;
              *) echo "unknown driver: $d"; exit 1 ;;
            esac
          done
          [ ${#out[@]} -gt 0 ] || { echo "no driver selected"; exit 1; }
          wins=()
          case "$OS" in
            linux|"") ;;
            windows|both)
              for d in ${DRIVERS//,/ }; do
                case "$d" in
                  zapo-core|zapo-core-llvm|zapo-startup|zapo-startup-llvm) wins+=("\"$d\"") ;;
                esac
              done
              [ ${#wins[@]} -gt 0 ] || { echo "os=$OS selects no zapo-core / zapo-startup driver"; exit 1; } ;;
            *) echo "unknown os: $OS"; exit 1 ;;
          esac
          echo "winmatrix=[$(IFS=,; echo "${wins[*]:-}")]" >> "$GITHUB_OUTPUT"
          if [ "$OS" = windows ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "runmatrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matrix=[$(IFS=,; echo "${out[*]}")]" >> "$GITHUB_OUTPUT"
          if [ "$RUN" = true ]; then
            echo "runmatrix=[$(IFS=,; echo "${runs[*]:-}")]" >> "$GITHUB_OUTPUT"
          else
            echo "runmatrix=[]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: driver ${{ matrix.driver }}
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Record the runner hardware
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz' || true
          free -m | sed -n 1,2p
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          path: rigsrc
          sparse-checkout: tests/driver-rigs
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          path: wt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: wt/.node-version
      - name: Build the compiler under test
        working-directory: wt
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install the rig
        working-directory: rigsrc/tests/driver-rigs
        # The box installs the rig without running dependency build scripts
        # (zapo-js's prepare/preinstall); mirror that so pnpm's strict
        # ignored-builds check does not fail the install.
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --config.strict-dep-builds=false --config.minimumReleaseAge=0
      # The provenance cache holds the checked-out package sources the
      # compiler maps (a mongodb checkout is ~2 GB); keyed by the rig lockfile.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/scriptc/provenance
          key: provenance-${{ matrix.driver }}-${{ hashFiles('rigsrc/tests/driver-rigs/pnpm-lock.yaml') }}
      - name: Build the driver
        env:
          DRIVER_NODE_HEAP_MB: ${{ inputs.node_heap_mb }}
        run: bash rigsrc/tests/driver-rigs/build.sh "${{ matrix.driver }}" "$GITHUB_WORKSPACE/wt/packages/cli/dist/main.js" "$GITHUB_WORKSPACE/out/${{ matrix.driver }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-${{ matrix.driver }}
          path: out/${{ matrix.driver }}.txt
          retention-days: 14
      # The binary of a successful build, to run it (absent when the build is refused).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-${{ matrix.driver }}-bin
          path: out/${{ matrix.driver }}.bin
          if-no-files-found: ignore
          retention-days: 14

  # The built binary of a connect or roundtrip entry, run beside Node on the same entry. MySQL 8 and Postgres 16 are service
  # containers of this job (127.0.0.1:3306 / :5432, password p); the connect entries need no server (a closed port).
  run:
    name: run ${{ matrix.driver }}
    needs: [plan, build]
    if: ${{ always() && needs.plan.outputs.runmatrix != '[]' && needs.plan.outputs.runmatrix != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.plan.outputs.runmatrix) }}
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: p
          MYSQL_DATABASE: d
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: p
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: rigsrc
          sparse-checkout: tests/driver-rigs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install the rig
        working-directory: rigsrc/tests/driver-rigs
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --config.strict-dep-builds=false --config.minimumReleaseAge=0
      - uses: actions/download-artifact@v4
        id: bin
        continue-on-error: true
        with:
          name: driver-${{ matrix.driver }}-bin
          path: out
      - name: Run the binary and Node, diff stdout, stderr and the exit code
        run: |
          set -u
          if [ ! -f "out/${{ matrix.driver }}.bin" ]; then
            echo "no binary: the build of ${{ matrix.driver }} was refused (see the build job)"
            exit 1
          fi
          chmod +x "out/${{ matrix.driver }}.bin"
          bash rigsrc/tests/driver-rigs/run-compare.sh "${{ matrix.driver }}" "out/${{ matrix.driver }}.bin" "$GITHUB_WORKSPACE/runout"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ matrix.driver }}
          path: runout
          if-no-files-found: ignore
          retention-days: 14

  # The same zapo-core / zapo-startup builds on a Windows host (windows-latest, zig cc, the x86_64-windows-gnu target the Windows CI lane
  # uses), so a defect that only exists where paths are built with backslashes shows up. Lab lane: the entries and the pin come from the
  # dispatched ref. PowerShell and cmd throughout, no bash path translation between the compiler and its inputs.
  build_win:
    name: win driver ${{ matrix.driver }}
    needs: plan
    if: ${{ needs.plan.outputs.winmatrix != '[]' && needs.plan.outputs.winmatrix != '' }}
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.plan.outputs.winmatrix) }}
    env:
      SCRIPTC_CC: zigcc
      SCRIPTC_TARGET: x86_64-windows-gnu
      SCRIPTC_NO_BIN_CACHE: "1"
      SCRIPTC_PROVENANCE_CACHE: ${{ github.workspace }}\.scriptc-provenance-cache
    steps:
      - name: Record the runner hardware
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, TotalVisibleMemorySize | Format-List
      - uses: actions/checkout@v4
        with:
          path: rigsrc
          sparse-checkout: tests/driver-rigs
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          path: wt
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: wt/.node-version
      - name: Build the compiler under test
        working-directory: wt
        shell: pwsh
        run: |
          zig version
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pnpm exited without a diagnostic; retrying once"
            pnpm install --frozen-lockfile
          }
          pnpm build
      - name: Install the rig
        working-directory: rigsrc/tests/driver-rigs
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --config.strict-dep-builds=false --config.minimumReleaseAge=0
      - uses: actions/cache@v4
        if: ${{ inputs.fresh_cache != 'true' }}
        with:
          path: ${{ github.workspace }}\.scriptc-provenance-cache
          key: provenance-win-${{ matrix.driver }}-${{ hashFiles('rigsrc/tests/driver-rigs/pnpm-lock.yaml') }}
      - name: Put Git's GNU tar first on PATH
        if: ${{ inputs.gnu_tar != 'false' }}
        shell: pwsh
        run: |
          Write-Host "tar before: $((Get-Command tar).Source)"
          "C:\Program Files\Git\usr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Which tar the build will use
        shell: pwsh
        run: |
          (Get-Command tar).Source | Write-Host
          tar --version | Select-Object -First 1 | Write-Host
      - name: Build the driver
        working-directory: rigsrc/tests/driver-rigs
        shell: pwsh
        env:
          DRIVER: ${{ matrix.driver }}
          DRIVER_NODE_HEAP_MB: ${{ inputs.node_heap_mb }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          $cli = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'wt\packages\cli\dist\main.js')).Path
          $entry = if ($env:DRIVER -like 'zapo-startup*') { 'zapo-startup.ts' } else { 'zapo-core.ts' }
          $backend = if ($env:DRIVER -like '*-llvm') { 'llvm' } else { 'c' }
          $bin = Join-Path $out ($env:DRIVER + '.bin')
          $txt = Join-Path $out ($env:DRIVER + '.txt')
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $heap = if ($env:DRIVER_NODE_HEAP_MB) { $env:DRIVER_NODE_HEAP_MB } else { '12288' }
          cmd /c "node --max-old-space-size=$heap `"$cli`" build $entry --provenance-sources --npm-static mysql2 --backend $backend -o `"$bin`" > `"$txt`" 2>&1"
          $rc = $LASTEXITCODE
          Add-Content -Path $txt -Value "rc=$rc"
          Add-Content -Path $txt -Value ("seconds=" + [int]$sw.Elapsed.TotalSeconds)
          Get-ChildItem $out | Format-Table Name, Length
          $errs = @(Select-String -Path $txt -Pattern ' - error SC').Count
          Write-Host "$($env:DRIVER) (windows): rc=$rc errors=$errs"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windriver-${{ matrix.driver }}
          # only the build log and the binary: a kept translation unit is 300+ MB and the account's artifact egress is limited
          path: |
            out/*.txt
            out/*.bin
            out/*.exe
          retention-days: 14

  # zapo-startup on Windows: the built binary and Node run the same entry (nothing connects), stdout, stderr and the exit code compared.
  run_win:
    name: win run ${{ matrix.driver }}
    needs: [plan, build_win]
    if: ${{ always() && needs.plan.outputs.winmatrix != '[]' && needs.plan.outputs.winmatrix != '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.plan.outputs.winmatrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rigsrc
          sparse-checkout: tests/driver-rigs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install the rig
        working-directory: rigsrc/tests/driver-rigs
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --config.strict-dep-builds=false --config.minimumReleaseAge=0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windriver-${{ matrix.driver }}
          path: out
      - name: Run the binary and Node, diff stdout, stderr and the exit code
        working-directory: rigsrc/tests/driver-rigs
        shell: pwsh
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          if ($env:DRIVER -notlike 'zapo-startup*') {
            Write-Host "$($env:DRIVER): a compile-only entry, nothing to run"
            exit 0
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          $run = Join-Path $env:GITHUB_WORKSPACE 'runout'
          New-Item -ItemType Directory -Force $run | Out-Null
          $bin = Get-ChildItem $out -Filter ($env:DRIVER + '.bin*') -ErrorAction SilentlyContinue | Where-Object { $_.Extension -ne '.txt' } | Select-Object -First 1
          if ($null -eq $bin) {
            Write-Host "no binary: the build of $($env:DRIVER) was refused (see the build job)"
            exit 1
          }
          $n = Start-Process node -ArgumentList '--no-warnings','zapo-startup.ts' -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$run\node.out" -RedirectStandardError "$run\node.err"
          Add-Content "$run\node.out" "exit=$($n.ExitCode)"
          $b = Start-Process $bin.FullName -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$run\bin.out" -RedirectStandardError "$run\bin.err"
          Add-Content "$run\bin.out" "exit=$($b.ExitCode)"
          $rc = 0
          foreach ($s in 'out','err') {
            $x = (Get-FileHash "$run\node.$s").Hash
            $y = (Get-FileHash "$run\bin.$s").Hash
            if ($x -eq $y) { Write-Host "$($env:DRIVER) (windows): std$s SAME ($((Get-Item "$run\node.$s").Length) bytes)" }
            else {
              Write-Host "$($env:DRIVER) (windows): std$s DIFFERS (node vs binary):"
              Compare-Object (Get-Content "$run\node.$s") (Get-Content "$run\bin.$s") | Select-Object -First 40 | Format-Table -AutoSize | Out-String | Write-Host
              $rc = 1
            }
          }
          Write-Host "--- node stdout"; Get-Content "$run\node.out"
          Write-Host "--- binary stderr"; Get-Content "$run\bin.err" | Select-Object -First 40
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winrun-${{ matrix.driver }}
          path: runout
          if-no-files-found: ignore
          retention-days: 14
